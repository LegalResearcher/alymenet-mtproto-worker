name: ALYEMENNET MTProto worker

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "Optional: copy only this source message ID for a one-off test"
        required: false
        type: string
        default: ""
      inspect_only:
        description: "Read-only: inspect message/media type without copying"
        required: false
        type: boolean
        default: false
      probe_bot:
        description: "Send a blocklisted test phrase to the bot; it must never publish"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: alyemen-net-mtproto-worker
  cancel-in-progress: false

jobs:
  forward-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_MESSAGE_ID: ${{ inputs.message_id }}
      INSPECT_ONLY: ${{ inputs.inspect_only }}
      PROBE_BOT: ${{ inputs.probe_bot }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests telethon==1.45.0

      - name: Run worker
        run: python worker.py
